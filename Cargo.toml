[package]
name = "atelier"
version = "0.1.0"
edition = "2024"
description = "A lazygit-style TUI and CLI that organise git worktrees into zellij sessions"
license = "MIT OR Apache-2.0"
repository = "https://github.com/remigourdon/atelier"

[dependencies]
catppuccin = { version = "2.8.0", features = ["ratatui"] }
clap = { version = "4", features = ["derive"] }
clap_complete = { version = "4.6.11", features = ["unstable-dynamic"] }
color-eyre = "0.6.5"
crossterm = { version = "0.29.0", features = ["event-stream"] }
futures = "0.3.34"
ratatui = "0.30.2"
regex = "1.13.1"
rusqlite = { version = "0.40.2", features = ["bundled"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
tokio = { version = "1.53.2", features = ["rt-multi-thread", "macros", "time", "sync"] }
toml_edit = { version = "0.25.15", features = ["serde"] }
tui-input = "0.15.5"
tui-markdown = { version = "0.3.10", default-features = false }

[dev-dependencies]
insta = "1.49.0"
tempfile = "3.27.0"
